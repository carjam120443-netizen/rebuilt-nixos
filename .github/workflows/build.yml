name: Build Rebuilt-NixOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rebuilt-NixOS
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build ISO
        run: nix build .#iso --print-build-logs

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-nixos-iso
          path: result/iso/*.iso
